apply plugin: 'com.android.application'

// 发布签名：凭据放 android/keystore.properties（已 gitignore）。发布任务
// 缺少凭据会在任务开始时 fail-closed，绝不生成可误发的未签名产物。
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
def hasReleaseKeystore = keystorePropsFile.exists()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
def releaseVersionCode = (System.getenv('DAOCJING_ANDROID_VERSION_CODE') ?: System.getenv('DAOCJING_VERSION_CODE') ?: '1').toInteger()
def releaseVersionName = System.getenv('DAOCJING_ANDROID_VERSION_NAME') ?: System.getenv('DAOCJING_VERSION_NAME') ?: '1.0.0'
def releaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (releaseTaskRequested && (!System.getenv('DAOCJING_ANDROID_VERSION_CODE') && !System.getenv('DAOCJING_VERSION_CODE'))) {
    throw new GradleException('DAOCJING_ANDROID_VERSION_CODE is required for release builds')
}
if (releaseTaskRequested && (!System.getenv('DAOCJING_ANDROID_VERSION_NAME') && !System.getenv('DAOCJING_VERSION_NAME'))) {
    throw new GradleException('DAOCJING_ANDROID_VERSION_NAME is required for release builds')
}

android {
    namespace "com.daocaijing.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.daocaijing.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseVersionCode
        versionName releaseVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                // 国产 ROM 兼容：显式开启 v1+v2+v3 全部签名方案
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// 发布任务必须使用正式签名；debug 构建可以在没有凭据的开发机上运行，
// 但 assembleRelease/bundleRelease 缺少 keystore 时直接失败，避免误发未签名包。
tasks.matching { it.name in ['assembleRelease', 'bundleRelease'] }.configureEach {
    doFirst {
        if (!hasReleaseKeystore) {
            throw new GradleException('Missing android/keystore.properties; refusing unsigned release artifact')
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // FCM 是可选运行时：没有 google-services.json 时仍可构建，App 自动退回原生轮询。
    implementation 'com.google.firebase:firebase-messaging:24.1.2'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
