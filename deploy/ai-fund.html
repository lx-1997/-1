<script>
const fmtMoney=v=>'¥'+Math.round(v).toLocaleString('zh-CN');
const fmtPct=v=>(v==null)?'—':(v>0?'+':'')+Number(v).toFixed(2)+'%';

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cl=v=>v>=0?'up':'down';
// 安全数值格式化：接口字段可能缺失/为字符串(部分源自第三方采集)，统一强转数字再插入 DOM，杜绝 NaN 显示与 innerHTML 注入
const nf=(v,d=2)=>{const n=Number(v);return isFinite(n)?n.toFixed(d):'—';};
const tt=iso=>{if(!iso)return'—';try{return new Date(iso).toLocaleString('zh-CN',{hour12:false}).slice(5);}catch(e){return'—';}};
const TAGS={buy:'买入',sell:'卖出',watch:'观察'},EAV={buy:'▲',sell:'▼',watch:'👁'};
const EVT_CLS={'快讯':'news','研报':'report','文章':'article','信号':'signal'},EVT_EM={'快讯':'⚡','研报':'📑','文章':'📰','信号':'📈'};
const QRW='dfw_2vQ9_k7Rm';
let S={data:null,tab:'center',sel:null,open:null,sort:'mv',lastTradeTs:null,mode:'arena',fund:'main',arena:null};
const STY_CN={balanced:'消息面派',aggressive:'激进派',value:'价值派',event:'事件派',contrarian:'逆向派'};
const isMobile=()=>window.innerWidth<1024;
function countUp(el,to,fmt,from){if(from==null||Math.abs(to-from)<1e-9){el.textContent=fmt(to);return;}const t0=performance.now();
  (function step(t){const k=Math.min(1,(t-t0)/650),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(step);})(performance.now());}
function bjNow(){const n=new Date();return new Date(n.getTime()+(n.getTimezoneOffset()+480)*60000);}
function liveState(d){const b=bjNow(),wd=b.getDay(),hm=b.getHours()*60+b.getMinutes();
  // 优先用后端权威的交易日/时段(含 A股节假日日历)；老快照缺字段时回退按星期+时间推算
  const tradingDay=(d.is_trading_day!==undefined)?d.is_trading_day:(wd>=1&&wd<=5);
  const sess=(d.in_session!==undefined)?d.in_session:(wd>=1&&wd<=5&&((hm>=570&&hm<=690)||(hm>=780&&hm<=900)));
  if((d.data_quality||{}).level!=='live')return{bdg:'○ 等待行情',beat:'2.6s'};
  if(!tradingDay)return{bdg:'🎏 休市·下个交易日 09:30 继续',beat:'2.9s'};
  if(sess)return{bdg:'● 实时撮合中',beat:'1.3s'};
  return{bdg:'🌙 已收盘·盘后复盘思考中',beat:'2.8s'};}
function rankOf(st){const n=(st&&st.win_streak)||0;return n>=8?'👑 屠榜中':n>=5?'🚀 火力全开':n>=3?'🔥 '+n+'连胜':'蓄势中';}
function gradeTxt(v){const a=Math.abs(v);return a<0.3?'中性':(v>0?(a>=0.6?'强多':'偏多'):(a>=0.6?'强空':'偏空'));}

function navLine(h,bench){
  const box=document.getElementById('navchart');
  if(!h||h.length<2){const d=S.data||{};box.innerHTML='<div class="empty" style="padding:22px;line-height:1.7">🚀 '+pNm()+'第 '+(d.days_running||1)+' 天发车<br><span style="font-size:11px">已扫读 '+((d.scan&&(d.scan.news+d.scan.report+d.scan.article))||0)+' 条站内情报 · 决策 '+(d.decisions_total||0)+' 次 · 净值曲线开盘后累积</span></div>';return;}
  const W=560,H=120,P=8,allv=h.map(x=>x.value).concat((bench||[]).map(x=>x.value));
  const mn=Math.min(...allv),mx=Math.max(...allv),sp=(mx-mn)||1,n=h.length;
  const X=(i,m)=>P+(W-2*P)*(m===1?.5:i/(m-1)),Y=z=>H-P-(H-2*P)*(z-mn)/sp;
  const path=arr=>arr.map((z,i)=>(i?'L':'M')+X(i,arr.length).toFixed(1)+' '+Y(z).toFixed(1)).join(' ');
  const me=h.map(x=>x.value);
  const ar='M'+X(0,n).toFixed(1)+' '+(H-P)+' '+me.map((z,i)=>'L'+X(i,n).toFixed(1)+' '+Y(z).toFixed(1)).join(' ')+' L'+X(n-1,n).toFixed(1)+' '+(H-P)+' Z';
  let svg='<svg style="width:100%;height:100%;display:block" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><defs><linearGradient id="ng" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="nf" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ec4899" stop-opacity=".18"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0"/></linearGradient></defs>';
  svg+='<path d="'+ar+'" fill="url(#nf)"/>';
  if(bench&&bench.length>1)svg+='<path d="'+path(bench.map(x=>x.value))+'" fill="none" stroke="#9aa0b8" stroke-width="1.6" stroke-dasharray="5 4"/>';
  svg+='<path d="'+path(me)+'" fill="none" stroke="url(#ng)" stroke-width="2.6" stroke-linejoin="round"/></svg>';
  let bub='<div class="navbub me" style="top:'+(Y(me[n-1])/H*100).toFixed(1)+'%"><span class="a">'+((S.data&&S.data.persona&&S.data.persona.emoji)||'🤖')+'</span>'+fmtPct((me[n-1]-1)*100)+'</div>';
  if(bench&&bench.length>1)bub+='<div class="navbub bench" style="top:'+(Y(bench[bench.length-1].value)/H*100).toFixed(1)+'%">沪深300 '+fmtPct((bench[bench.length-1].value-1)*100)+'</div>';
  box.innerHTML=svg+bub;
}

/* ===== K线：实像素渲染(不拉伸) + 量 + MA5/20 + 坐标 + 十字光标 ===== */
function drawK(box,p){
  const full=(p.kline||[]);
  const w=Math.round(box.clientWidth||0),h=Math.round(box.clientHeight||0);
  if(full.length<3||w<60||h<80){box.innerHTML='<div class="empty">日线数据加载中…</div>';return;}
  // 显示窗口聚焦「有本站内容的时段」：最早相关催化剂靠左(留3根上下文)，无则近24根；MA 仍用全量历史算保证准确
  const fdmap={};full.forEach((k,i)=>fdmap[k.d]=i);const lastFD=full[full.length-1].d;
  const fIdx=dt=>{if(fdmap[dt]!=null)return fdmap[dt];if(dt>=lastFD)return full.length-1;let r=-1;for(let i=0;i<full.length;i++){if(full[i].d<=dt)r=i;else break;}return r;};
  const _ei=(p.events||[]).map(e=>fIdx(e.date)).filter(i=>i>=0);
  // 窗口贴着催化剂：从最早事件往前留 2 根开始，让快讯/研报铺满整张图(不强行留空白左半)；无事件则近 22 根
  let start=_ei.length?Math.max(0,Math.min(..._ei)-2):Math.max(0,full.length-22);
  start=Math.min(start,Math.max(0,full.length-8));  // 至少留 ~8 根供均线/上下文
  const kl=full.slice(start),csF=full.map(k=>k.c);
  const P=6,axisH=14,volH=Math.round(h*0.20),gp=5;
  const pTop=26,pBot=h-axisH-volH-gp,vTop=h-axisH-volH,vBot=h-axisH;  // 顶部预留一条标记轨道，旗标不再压蜡烛
  let mn=Math.min(...kl.map(k=>k.l)),mx=Math.max(...kl.map(k=>k.h));const pad=(mx-mn)*.06||1;mn-=pad;mx+=pad;
  const n=kl.length,gw=(w-2*P)/n,bw=Math.max(3,Math.min(30,gw*.6));
  const X=i=>P+gw*i+gw/2,Y=v=>pBot-(pBot-pTop)*(v-mn)/(mx-mn);
  const vmax=Math.max(...kl.map(k=>k.v||0))||1,VY=v=>vBot-(vBot-vTop)*(v/vmax);
  const cs=kl.map(k=>k.c),ma=(per,i)=>{const gi=start+i;if(gi<per-1)return null;let s=0;for(let j=gi-per+1;j<=gi;j++)s+=csF[j];return s/per;};
  let g='';

function spark(hist,bench,color){
  const h=(hist||[]).map(x=>x.value),b=(bench||[]).map(x=>x.value);
  if(h.length<2){ // 未开赛/数据少：画一条 1.0 基准虚线 + 「蓄势」，比"累积中"文字更像活的
    return '<svg viewBox="0 0 300 46" preserveAspectRatio="none" style="width:100%;height:100%;display:block">'+
      '<line x1="3" y1="23" x2="297" y2="23" stroke="'+color+'" stroke-width="1.6" stroke-dasharray="5 4" opacity=".55"/>'+
      '<text x="150" y="18" text-anchor="middle" font-size="9" fill="#9aa0b8">蓄势 · 开盘开赛</text></svg>';}
  const W=300,H=46,P=3,all=h.concat(b),mn=Math.min(...all),mx=Math.max(...all),sp=(mx-mn)||1;
  const X=(i,n)=>P+(W-2*P)*(n<2?.5:i/(n-1)),Y=v=>H-P-(H-2*P)*(v-mn)/sp;
  const path=a=>a.map((v,i)=>(i?'L':'M')+X(i,a.length).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  let s='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:100%;display:block">';
  if(b.length>1)s+='<path d="'+path(b)+'" fill="none" stroke="#c2c7da" stroke-width="1.4" stroke-dasharray="4 3"/>';
  s+='<path d="'+path(h)+'" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linejoin="round"/></svg>';
  return s;
}

}
function showStSwitch(){
  const sts=(S.arena&&S.arena.strategies)||[];const el=document.getElementById('stswitch');if(!el)return;
  el.innerHTML=sts.map(s=>'<span class="stchip'+(s.fund_id===S.fund?' on':'')+'" data-fund="'+esc(s.fund_id)+'">'+(s.emoji||'')+esc(s.name)+'</span>').join('');
}
function setMode(m){
  S.mode=m;
  document.getElementById('arenaView').style.display=m==='arena'?'flex':'none';
  document.getElementById('appView').style.display=m==='detail'?'flex':'none';
  document.getElementById('appView').classList.toggle('detail',m==='detail');
}
// 网络连通性指示：连续失败 ≥2 次就把状态徽标改成「连接中断·数据停留在 HH:MM」，避免用户盯着旧数据误以为是实时
function netOk(){S.lastOk=Date.now();S.failN=0;}
function netFail(){S.failN=(S.failN||0)+1;if(S.failN>=2){const t=S.lastOk?new Date(S.lastOk).toLocaleTimeString('zh-CN',{hour12:false}).slice(0,5):'';const b=document.getElementById('bdg');if(b)b.textContent='⚠ 连接中断'+(t?' · 数据停留在 '+t:'');}}
async function loadArena(){
  try{const r=await fetch('/api/ai-fund/arena?w='+QRW,{cache:'no-store',headers:{'Accept':'application/json'}});if(!r.ok)throw 0;
    const d=await r.json();netOk();
    if(d&&d.ready===false){ // 引擎竞技场未就绪 → 回退单账户主视图
      if(S.mode==='arena'){S.fund='main';setMode('detail');await load();}
      return;}
    S.arena=d;if(S.mode==='arena')renderArena(d);showStSwitch();
  }catch(e){ // 竞技场端点不存在/报错 → 回退单账户主视图，保证页面始终可用
    netFail();
    if(!S.arena&&S.mode==='arena'){S.fund='main';setMode('detail');await load();}
  }
}
function openDetail(fund){S.fund=fund;S.sel=null;S.open=null;S.data=null;setMode('detail');showStSwitch();load();}
function backToArena(){setMode('arena');loadArena();}
async function load(){try{const r=await fetch('/api/ai-fund/snapshot?strategy='+encodeURIComponent(S.fund)+'&w='+QRW,{cache:'no-store',headers:{'Accept':'application/json'}});if(!r.ok)throw 0;render(await r.json());netOk();showStSwitch();}
  catch(e){netFail();if(!S.data)document.getElementById('colCenter').innerHTML='<div class="empty">数据加载失败，正在自动重试…</div>';}}
function poll(){if(S.mode==='arena')loadArena();else load();}
// 竞技场卡片 / 切换器 / 返回
document.addEventListener('click',e=>{
  const lc=e.target.closest('.lbcard[data-fund]');if(lc){openDetail(lc.dataset.fund);return;}
  const sc=e.target.closest('.stchip[data-fund]');if(sc){if(sc.dataset.fund!==S.fund)openDetail(sc.dataset.fund);return;}
  if(e.target.closest('#backArena')){backToArena();return;}
});
// 轮询：标签页切到后台时暂停(省服务器+省流量，避免后台标签持续打接口)，回前台立即拉一次并恢复
let _pollT=null;
function startPoll(){stopPoll();_pollT=setInterval(poll,30000);}
function stopPoll(){if(_pollT){clearInterval(_pollT);_pollT=null;}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopPoll();else{poll();startPoll();}});
loadArena();startPoll();
</script>
</body>
