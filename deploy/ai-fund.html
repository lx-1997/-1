<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AI 策略实验室 · DeepFocus</title>
<meta name="description" content="五种 AI 投资策略使用同一组 DeepFocus 公开信息进行模拟交易，实时公开收益、持仓与完整决策依据。虚拟资金，不构成投资建议。" />
<meta property="og:title" content="DeepFocus AI 策略实验室" />
<meta property="og:description" content="五种投资纪律，同一组公开信息，实时验证策略表现。虚拟资金·模拟交易·不构成投资建议。" />
<style>
  :root{--bg:#eef0fb;--card:#fff;--ink:#1b1f33;--ink2:#6b7088;--ink3:#71768d;--line:#edeef6;
    --purple:#7c3aed;--magenta:#ec4899;--cyan:#06b6d4;--amber:#f59e0b;
    --up:#16c784;--down:#f6465d;--upbg:rgba(22,199,132,.12);--downbg:rgba(246,70,93,.12);
    --grad:linear-gradient(135deg,#7c3aed,#a855f7 45%,#ec4899);}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  .app{max-width:none;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:11px 22px 7px;gap:9px}
  .up{color:var(--up)}.down{color:var(--down)}.num{font-variant-numeric:tabular-nums}.mute{color:var(--ink2)}
  .empty{color:var(--ink3);font-size:13px;text-align:center;padding:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 26px rgba(76,52,140,.07)}
  .sec-h{font-size:13px;font-weight:800;margin:0 0 10px;color:var(--ink);display:flex;align-items:center;gap:7px}
  .sec-h small{font-weight:500;color:var(--ink3);font-size:11px}

  .top{flex:0 0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 18px;border-radius:20px;background:var(--grad);box-shadow:0 10px 30px rgba(124,58,237,.28);color:#fff;position:relative;overflow:hidden}
  .top::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);pointer-events:none}
  .top.flash::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.5),transparent 70%);transform:translateX(-100%);animation:sweep 1s ease}
  @keyframes sweep{to{transform:translateX(100%)}}
  .ava{font-size:26px;width:52px;height:52px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.4);border-radius:16px;position:relative}
  .ava.shake{animation:shake .5s}@keyframes shake{0%,100%{transform:none}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
  .ava .dot{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:#3dffa2;border:2px solid #8b3ddf;box-shadow:0 0 0 0 rgba(61,255,162,.7);animation:pulse var(--beat,1.8s) infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,255,162,.6)}70%{box-shadow:0 0 0 10px rgba(61,255,162,0)}100%{box-shadow:0 0 0 0 rgba(61,255,162,0)}}
  .who .nm{font-size:21px;font-weight:900;letter-spacing:.5px}.who .nm .lv{font-size:10px;font-weight:800;margin-left:8px;background:rgba(255,255,255,.22);padding:2px 8px;border-radius:8px;vertical-align:middle}
  .who .tg{font-size:12px;opacity:.85}
  .mood{font-size:13px;font-weight:700;padding:5px 13px;border-radius:13px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);white-space:nowrap}
  .topright{margin-left:auto;display:flex;align-items:center;gap:9px}
  .bdg{font-size:11px;font-weight:700;padding:3px 10px;border-radius:11px;background:rgba(255,255,255,.2);white-space:nowrap}
  .share{font-size:13px;font-weight:700;padding:7px 15px;border-radius:13px;background:#fff;color:var(--purple);border:none;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.12)}
  /* DeepFocus 本站快讯（侧边栏精简列表） */
  .wirebox{margin-top:14px;border-top:1px dashed var(--line);padding-top:11px}
  .wirebox .wh{font-size:12px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .wirebox .wh .more{margin-left:auto;font-size:11px;color:var(--purple);font-weight:800;text-decoration:none}
  .wli{display:flex;gap:7px;align-items:flex-start;padding:6px 0;border-bottom:1px solid #f4f5fb;font-size:12px;line-height:1.45}
  .wli:last-child{border-bottom:none}
  .wli .s{flex:0 0 auto;font-size:10px;font-weight:800;color:var(--cyan);background:rgba(6,182,212,.1);padding:1px 6px;border-radius:6px;margin-top:1px}
  .wli .wt{color:var(--ink2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  /* 脑内独白（7×24「沉淀思考」） */
  .ev.muse .eav{background:linear-gradient(135deg,#7c3aed,#06b6d4);font-size:14px}
  .ev.muse .bub{background:linear-gradient(135deg,#faf7ff,#f0fbff);border-color:#e7e0fb;border-radius:14px}
  .muse-ph{font-size:11px;font-weight:800;color:var(--purple);background:rgba(124,58,237,.1);padding:1px 8px;border-radius:7px}
  .muse-tx{font-size:13px;line-height:1.65;color:var(--ink);margin-top:5px;font-weight:500}
  .muse-refs{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .muse-refs .r{font-size:11px;color:var(--ink2);background:#f4f5fb;border-radius:7px;padding:2px 8px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .muse-refs .r b{color:var(--cyan);font-weight:800}.muse-refs .r:hover{background:#ebe7fb}
  .musecard{padding:15px 16px;border-radius:16px;background:linear-gradient(135deg,#faf7ff,#f0fbff);border:1px solid #e7e0fb}
  .musecard .mh{font-size:13px;font-weight:800;color:var(--purple);display:flex;align-items:center;gap:7px}
  .musecard .mh .pulse{width:8px;height:8px;border-radius:50%;background:#7c3aed;animation:pulse 1.8s infinite}
  .musecard .mt{font-size:15px;line-height:1.75;margin-top:11px;font-weight:500;color:var(--ink)}
  .musecard .mline{font-size:11px;color:var(--ink3);margin-top:11px;line-height:1.5}
  /* 阿尔法的认知/记忆（持续学习进化） */
  .membox{margin-top:14px;border-top:1px dashed var(--line);padding-top:11px}
  .membox .mh2{font-size:12px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:6px;margin-bottom:7px;flex-wrap:wrap}
  .membox .mh2 small{font-weight:600;color:var(--ink3);font-size:10px;flex-basis:100%}
  .mem{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f4f5fb;cursor:pointer}
  .mem:last-child{border-bottom:none}.mem:hover{background:#faf8ff}
  .mem .mty{flex:0 0 auto;font-size:13px;line-height:1}
  .mem .mmid{flex:1;min-width:0}.mem .mtt{font-size:12px;color:var(--ink);font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mem .mcb{height:4px;border-radius:2px;background:#eef0f7;overflow:hidden;margin-top:4px}.mem .mcb i{display:block;height:100%;background:var(--grad);transition:width .7s cubic-bezier(.2,.8,.3,1)}
  .mem .mcf{flex:0 0 auto;font-size:11px;font-weight:800;color:var(--purple);font-variant-numeric:tabular-nums}
  .mempop-list{margin:7px 0 3px;display:flex;flex-direction:column;gap:3px}
  .mempop-it{font-size:12px;color:var(--ink);line-height:1.45}
  .mempop-meta{font-size:10px;color:var(--ink3);margin-top:5px}
  .muse-recall{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .rcl{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--amber);background:rgba(245,158,11,.12);border-radius:7px;padding:2px 8px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .hero{flex:0 0 auto;display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}
  .heroL{flex:1;min-width:240px;padding:14px 19px;display:flex;flex-direction:column;justify-content:center}
  .heroL .lbl{font-size:12px;color:var(--ink2);font-weight:600}
  .heroL .ret{font-size:42px;font-weight:900;line-height:1;letter-spacing:-1px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .heroL .ret.dn{background:linear-gradient(135deg,#f6465d,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
  .heroL .sub{font-size:13px;color:var(--ink2);margin-top:6px}.heroL .sub b{color:var(--ink)}
  .heroL #herostat{font-size:15px;margin-top:8px}.heroL #herostat b{font-weight:800}  /* 强化：总资产/盈亏提为头部关键数 */
  .heroR{flex:1;min-width:300px;padding:12px 15px;display:flex;flex-direction:column;position:relative}  /* 弱化：沪深300基准图从独大(1.7)收到与收益率卡相当 */
  .alpha-badge{position:absolute;right:14px;top:12px;font-size:13px;font-weight:800;padding:5px 12px;border-radius:13px;color:#fff;background:var(--grad);box-shadow:0 5px 14px rgba(124,58,237,.3);z-index:2}
  .alpha-badge.dn{background:#9aa0b8;box-shadow:none}.alpha-badge.wait{background:#cdd2e6;color:#5b6178;box-shadow:none}
  .riskline{margin-top:9px;gap:8px 12px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink2);line-height:1.5}
  .riskline b{color:var(--ink);font-weight:800}.riskline i{color:var(--ink3);font-style:normal;margin:0 1px}
  .riskline .acc{color:var(--ink3)}
  .navchart{flex:1;position:relative;min-height:88px}
  .navbub{position:absolute;right:0;transform:translateY(-50%);display:flex;align-items:center;gap:5px;color:#fff;font-size:12px;font-weight:800;padding:3px 9px 3px 4px;border-radius:14px;white-space:nowrap;z-index:2}
  .navbub.me{background:var(--grad);box-shadow:0 4px 12px rgba(124,58,237,.35)}.navbub.bench{background:#9aa0b8;font-weight:700;font-size:11px}
  .navbub .a{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:11px}

  .kpis{flex:0 0 auto;display:flex;gap:10px;flex-wrap:wrap}
  .kpi{flex:1;min-width:116px;padding:10px 14px;display:flex;flex-direction:column;gap:3px}
  .kpi .l{font-size:11px;color:var(--ink2);font-weight:600}.kpi .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}.kpi .x{font-size:10px;color:var(--ink3)}
  .kpi.accent{background:var(--card);border-color:var(--line)}  /* 弱化：本站信息驱动去紫色高亮，回归普通卡(8%/0%收益不再被放大) */

  .say{flex:0 0 auto;display:flex;gap:9px;align-items:center;padding:6px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}  /* 弱化：口语解说去紫底缩小，不再占整条主位 */
  .say .sa{font-size:15px;width:26px;height:26px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--grad);border-radius:8px}
  .say .t{font-size:12px;line-height:1.45;font-weight:500;flex:1;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .scan{font-size:11px;font-weight:700;color:var(--cyan);background:rgba(6,182,212,.1);padding:4px 10px;border-radius:11px;white-space:nowrap}

  .tabs{display:none;gap:7px;flex:0 0 auto}
  .tab{flex:1;text-align:center;font-size:13px;font-weight:700;padding:9px 4px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer}
  .tab.on{color:#fff;background:var(--grad);border-color:transparent;box-shadow:0 5px 16px rgba(124,58,237,.3)}

  .grid{flex:1 1 auto;display:grid;grid-template-columns:360px minmax(0,1fr) 440px;gap:14px;min-height:0}
  .col{padding:13px 15px;overflow-y:auto;min-height:0;display:flex;flex-direction:column}
  .col::-webkit-scrollbar{width:7px}.col::-webkit-scrollbar-thumb{background:#dcdfee;border-radius:4px}

  .sortbtn{margin-left:auto;font-size:11px;color:var(--purple);background:none;border:none;cursor:pointer;font-weight:700}
  .hold{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:14px;margin-bottom:8px;cursor:pointer;border:1px solid var(--line);transition:.15s;background:#fcfcff}
  .hold:hover{box-shadow:0 6px 18px rgba(76,52,140,.1);transform:translateY(-1px)}
  .hold.on{border-color:var(--purple);background:linear-gradient(135deg,#faf5ff,#fdf2f8)}
  .hold .rk{width:22px;height:22px;flex:0 0 auto;border-radius:8px;background:var(--grad);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .hold .mid{flex:1;min-width:0}.hold .nm{font-weight:800;font-size:14px}.hold .cd{font-size:11px;color:var(--ink3)}
  .hold .meta{font-size:11px;color:var(--ink3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}.hold .temp{color:var(--cyan);font-weight:700}
  .hold .wb{height:5px;border-radius:3px;background:#eef0f7;overflow:hidden;margin-top:4px}.hold .wb i{display:block;height:100%;background:var(--grad);width:0;transition:width .7s cubic-bezier(.2,.8,.3,1)}
  .hold .rt{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  .pill{font-size:13px;font-weight:800;padding:3px 9px;border-radius:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .pill.up{color:var(--up);background:var(--upbg)}.pill.dn{color:var(--down);background:var(--downbg)}
  .fp{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
  .sumrow{margin-top:6px;padding:9px 11px;border-radius:12px;background:#f7f8fc;font-size:12px;font-weight:700;display:flex;justify-content:space-between}

  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
  .chip{font-size:12px;font-weight:700;padding:5px 12px;border-radius:12px;border:1px solid var(--line);background:#fcfcff;color:var(--ink2);cursor:pointer;white-space:nowrap}
  .chip.on{color:#fff;background:var(--grad);border-color:transparent}.chip .pn{margin-left:5px;font-size:11px;opacity:.95}.chip.on .pn{color:#fff;opacity:1}
  .kmeta{display:flex;align-items:baseline;gap:9px;margin-bottom:8px;flex-wrap:wrap}.kmeta .nm{font-weight:900;font-size:19px}.kmeta .cd{color:var(--ink3);font-size:11px}
  .kmeta .px{font-size:24px;font-weight:900;margin-left:auto;font-variant-numeric:tabular-nums}.kmeta .cg{font-size:15px;font-weight:800}
  .kwrap{flex:1;display:flex;flex-direction:column;min-height:0}
  .chart{position:relative;flex:1;min-height:300px}
  .kovl{position:absolute;inset:0;pointer-events:none}.kovl>*{position:absolute}
  .kmark{transform:translate(-50%,-50%);font-size:15px;pointer-events:auto;cursor:default;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
  .kmark.buy{color:var(--up)}.kmark.sell{color:var(--down)}
  .kevt{transform:translateX(-50%);pointer-events:auto;cursor:pointer;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;border:1.5px solid;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .kevt:hover{transform:translateX(-50%) scale(1.2)}.kevt.fresh{animation:epulse 1.6s infinite}
  @keyframes epulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .kevt.news{color:var(--cyan);border-color:var(--cyan)}.kevt.report{color:var(--purple);border-color:var(--purple)}.kevt.article{color:var(--amber);border-color:var(--amber)}.kevt.signal{color:var(--up);border-color:var(--up)}
  .kevt .pole{position:absolute;top:16px;left:50%;width:1.5px;height:7px;background:currentColor;opacity:.45}
  .kevt.trig{width:20px;height:20px;font-size:11px;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--purple);z-index:3}
  .kevn{position:absolute;top:-6px;right:-7px;min-width:13px;height:13px;padding:0 2px;border-radius:7px;background:var(--purple);color:#fff;font-size:8px;line-height:13px;font-weight:800;text-align:center;box-shadow:0 0 0 1.5px #fff}
  .kcross{position:absolute;top:0;bottom:14px;width:1px;background:rgba(124,58,237,.5);display:none;pointer-events:none}
  .ktip{position:absolute;background:#1b1f33;color:#fff;font-size:11px;padding:6px 9px;border-radius:8px;display:none;pointer-events:none;white-space:nowrap;line-height:1.55;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.3)}
  .ktip b{font-weight:700}
  .klegend{font-size:10px;color:var(--ink3);margin-top:5px}.klegend i{display:inline-block;width:11px;height:2px;vertical-align:middle;margin-right:2px}.klegend .m5{background:var(--amber)}.klegend .m20{background:var(--purple)}
  .evtpop{position:fixed;z-index:999;max-width:300px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;box-shadow:0 16px 40px rgba(76,52,140,.22);display:none;font-size:13px;color:var(--ink)}
  .evtpop .src{font-size:11px;color:var(--ink3);font-weight:700}.evtpop .ti{margin:5px 0;line-height:1.45}.evtpop a{color:var(--purple);text-decoration:none;font-weight:700;font-size:12px}

  /* 解盘对话 */
  .ev{display:flex;gap:9px;margin-bottom:12px;cursor:pointer;animation:rise .4s ease both}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  .ev .eav{width:32px;height:32px;flex:0 0 auto;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
  .ev.buy .eav{background:linear-gradient(135deg,#16c784,#0ea5e9)}.ev.sell .eav{background:linear-gradient(135deg,#f6465d,#fb7185)}.ev.watch .eav{background:#e6e9f5;color:#9aa0b8;font-size:13px;width:26px;height:26px}
  .bub{flex:1;min-width:0;background:#f7f8fc;border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:9px 12px;transition:.15s}
  .ev.watch{margin-bottom:8px}.ev.watch .bub{background:transparent;border-style:dashed;padding:7px 11px}.ev.watch .who2{color:var(--ink2)}.ev.watch .ev-foot{display:none}.ev.watch.open .ev-foot{display:flex}
  .ev:hover .bub{border-color:#dcd2f5;box-shadow:0 4px 14px rgba(76,52,140,.08)}
  .ev-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .who2{font-weight:800;font-size:13px}.tg2{font-size:11px;font-weight:800;padding:1px 8px;border-radius:7px}
  .tg2.buy{color:var(--up);background:var(--upbg)}.tg2.sell{color:var(--down);background:var(--downbg)}.tg2.watch{color:var(--cyan);background:rgba(6,182,212,.12)}
  .ev-nm{font-weight:700;font-size:13px}.ev-cd{color:var(--ink3);font-size:11px}
  .ev-foot{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:11px;color:var(--ink3)}
  .ev-exp{margin-left:auto;color:var(--purple);font-weight:700}.ev.open .ev-exp .ar{display:inline-block;transform:rotate(90deg)}
  .narr{font-size:13px;line-height:1.55;font-weight:500;margin-top:4px}.teaser{font-size:13px;color:var(--ink2);line-height:1.5;margin-top:4px}
  .causal{display:flex;align-items:stretch;margin:8px 0;border-radius:10px;overflow:hidden;border:1px solid #e7d9fb;font-size:11px}
  .causal .cstep{flex:1;padding:6px 8px;background:#faf7ff;display:flex;flex-direction:column;gap:1px;min-width:0}
  .causal .cstep:nth-child(2){background:#f3edff}.causal .cstep:nth-child(3){background:linear-gradient(135deg,#f0fff8,#eafaf2)}
  .causal .ct{font-size:10px;color:var(--ink3);font-weight:700}.causal .cv{font-size:11px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis}
  .cchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.cc{font-size:11px;border-radius:8px;padding:4px 9px;font-weight:600;cursor:pointer}
  .cc.cat{color:var(--cyan);background:rgba(6,182,212,.1)}.cc.lead{color:var(--purple);background:rgba(124,58,237,.1);font-weight:800}.cc.bp{color:var(--magenta);background:rgba(236,72,153,.1)}
  .scores{display:grid;grid-template-columns:1fr;gap:5px;margin:8px 0 2px}

  /* 桌面短屏(笔记本 1366×768 等,可视高 < ~820px):详情仪表盘原 height:100dvh 锁死视口、三列各自内部滚动,
     视口不够高时头部(收益/KPI/解说)吃掉上半屏、网格被压到几乎不可滚 → 滑轮"无法下滑"。
     短屏改为整页滚动(列随内容铺开、页面整体滚动);align-items:start 防中栏被最高的右栏拉高致 K 线巨幅化。
     大屏(≥820px 高)不命中,原"一屏仪表盘+列内滚动"完全保留。 */
  @media (min-width:1024px) and (max-height:820px){
    .app{height:auto;min-height:100dvh}
    .grid{align-items:start}
    .col{overflow:visible}
  }

    .chart{min-height:320px}.heroL .ret{font-size:34px}.hero{flex-direction:column}.alpha-badge{top:10px}
  }
  @media(max-width:560px){.who .nm{font-size:18px}.top{padding:11px 14px}.heroL .ret{font-size:30px}.kpi{min-width:45%}}

  .lbcard.rank1 .lbrank{background:linear-gradient(135deg,#f59e0b,#f4c84a);color:#fff}
  .lbava{font-size:22px;width:40px;height:40px;flex:0 0 auto;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--cbg,rgba(124,58,237,.1))}
  .lbwho{flex:1;min-width:0}.lbnm{font-size:15px;font-weight:900;display:flex;align-items:center;gap:6px}

  /* ===== 竞技场：今日分歧(跨智能体共识/分歧) + 多空辩论回放 ===== */
  .dvcard,.dbcard{padding:14px 16px}

  /* ===== V4 · Quiet intelligence =====
     用克制的中性色、细边框和清晰层级替代大面积渐变与装饰性阴影。 */
  :root{
    --bg:#f4f4f1;--card:#ffffff;--ink:#141518;--ink2:#575c66;--ink3:#8b9099;
    --line:#e5e5e1;--purple:#5557d9;--magenta:#a85583;--cyan:#157f8f;--amber:#a86d16;
    --up:#078564;--down:#c0445a;--upbg:rgba(7,133,100,.08);--downbg:rgba(192,68,90,.08);
    --grad:#5557d9;

  .lbfoot{display:flex;align-items:center;gap:8px;min-height:26px;margin-top:auto;padding-top:11px;border-top:1px solid #efefec}
  .lbtop{min-width:0;padding:0;border-radius:0;background:transparent;color:var(--ink2);font-size:10px;font-weight:600}
  .lbcta{margin-left:auto;color:var(--purple);font-size:10px;font-weight:700;white-space:nowrap}
  .arena-foot{padding:4px 0 10px;color:var(--ink3);font-size:10px;line-height:1.7}
  .arena-foot a{color:var(--ink2)}

  /* 次级内容默认折叠，保留完整信息但不再与策略表现抢首屏。 */
  .dvcard,.dbcard{padding:0;border-radius:14px;box-shadow:none}
  .dvcard>summary,.dbcard summary{
    min-height:70px;padding:16px 18px;list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px
  }
  .dvcard>summary::-webkit-details-marker{display:none}
  .fold-copy{min-width:0}
  .fold-kicker{display:block;margin-bottom:4px;color:var(--purple);font-size:9px;font-weight:750;letter-spacing:.12em;text-transform:uppercase}
  .fold-title{display:block;font-size:14px;font-weight:680}
  .fold-sub{display:block;margin-top:3px;color:var(--ink3);font-size:10px;font-weight:450}
  .fold-count{margin-left:auto;padding:5px 9px;border-radius:999px;background:#f1f1ee;color:var(--ink2);font-size:10px;font-weight:650;white-space:nowrap}
  .fold-arrow{color:var(--ink3);font-size:18px;transition:transform .16s}
  .dvcard[open] .fold-arrow{transform:rotate(90deg)}
  .dv-body{padding:0 16px 16px;border-top:1px solid #efefec}
  .dv-cons{margin:14px 0 10px;border-radius:9px;background:#f5f5f2}
  .dv-it{border-radius:10px;background:#fff}
  .dbcard .db-body{margin:0;padding:0 16px 16px;border-top:1px solid #efefec}
  .dbcard .db-disc{margin:0;padding:10px 16px 14px;border-top:1px solid #efefec}
  .dbcard summary{font-size:13px}
  .dbcard .ar{color:var(--ink3)}
  .db-static{padding:16px 18px}
  .db-static .empty{padding:8px 0 0;text-align:left;font-size:11px}

  /* 策略详情 */
  .app{max-width:1600px;height:auto;min-height:100dvh;padding:20px 38px 12px;gap:12px}
  .top{
    padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);
    box-shadow:0 1px 2px rgba(20,21,24,.035);overflow:visible
  }
  .top::after{display:none}
  .ava{width:42px;height:42px;border:1px solid #e6e6e2;border-radius:11px;background:#f2f2ef;font-size:21px}
  .ava .dot{right:-1px;bottom:-1px;width:9px;height:9px;border:2px solid #fff;background:#37b88d;animation:none}
  .who .nm{font-size:17px;font-weight:720;letter-spacing:-.02em}
  .who .nm .lv{margin-left:6px;padding:2px 6px;border-radius:5px;background:#eeefff;color:var(--purple);font-size:9px}
  .who .tg{margin-top:2px;color:var(--ink3);font-size:10px}
  .mood{padding:4px 9px;border:1px solid var(--line);border-radius:999px;background:#f7f7f4;color:var(--ink2);font-size:10px}
  .topright{gap:7px}
  .bdg{padding:4px 9px;border-radius:999px;background:#f1f8f5;color:#31765f;font-size:10px}
  .share{padding:7px 11px;border:1px solid #24262c;border-radius:9px;background:#202228;color:#fff;box-shadow:none;font-size:11px}
  .backbar,.app.detail .backbar{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#f7f7f4;color:var(--ink2);font-size:11px}
  .stswitch{gap:5px}
  .stchip{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink2);font-size:10px}
  .stchip.on{border-color:#cfd0f3;background:#eeefff;color:var(--purple)}
  .hero{gap:12px}
  .heroL{min-width:260px;padding:20px 22px}
  .heroL .lbl{color:var(--ink3);font-size:10px}
  .heroL .ret,.heroL .ret.dn{margin-top:5px;background:none;color:var(--ink);font-size:40px;font-weight:680;letter-spacing:-.045em}
  .heroL .ret.up{color:var(--up)}.heroL .ret.down,.heroL .ret.dn{color:var(--down)}
  .heroL .sub{font-size:11px}
  .heroL #herostat{font-size:12px}
  .heroR{padding:17px 19px}
  .alpha-badge,.alpha-badge.dn,.alpha-badge.wait{padding:4px 9px;border-radius:999px;background:#eeefff;color:var(--purple);box-shadow:none;font-size:10px}
  .navbub.me{background:var(--purple);box-shadow:none}
  .kpis{gap:8px}
  .kpi{min-width:150px;padding:11px 14px}
  .kpi .l{font-size:10px}.kpi .v{font-size:16px}
  .say{padding:8px 11px;border-radius:10px}
  .say .sa{width:24px;height:24px;border-radius:7px;background:#f0f0ed;font-size:13px}
  .say .t{font-size:11px}.scan{background:#edf5f5;color:var(--cyan);font-size:9px}
  .tabs{gap:5px}
  .tab{padding:8px;border-radius:9px;font-size:11px}
  .tab.on{border-color:#cfd0f3;background:#eeefff;color:var(--purple);box-shadow:none}
  .grid{grid-template-columns:320px minmax(0,1fr) 390px;gap:12px}
  .col{padding:15px}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
  .panel-kicker{display:block;margin-bottom:3px;color:var(--purple);font-size:8px;font-weight:750;letter-spacing:.14em;text-transform:uppercase}
  .panel-head h3{margin:0;font-size:14px;font-weight:700;letter-spacing:-.02em}
  .panel-head h3 small{margin-left:4px;color:var(--ink3);font-size:9px;font-weight:550}
  .sortseg,.logtabs{display:flex;padding:2px;border:1px solid var(--line);border-radius:8px;background:#f5f5f2}
  .sortbtn,.logtab{margin:0;padding:4px 7px;border:0;border-radius:6px;background:transparent;color:var(--ink3);font-size:9px;font-weight:650;cursor:pointer}
  .sortbtn.on,.logtab.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,21,24,.08)}
  .portfolio-summary{display:grid;grid-template-columns:1.25fr .8fr 1fr;margin-bottom:11px;border:1px solid var(--line);border-radius:10px;background:#fafaf8}
  .portfolio-summary>span{min-width:0;padding:9px 10px}
  .portfolio-summary>span+span{border-left:1px solid var(--line)}
  .portfolio-summary small,.position-glance small,.trade-summary small,.trade-facts small,.hold-prices small{display:block;color:var(--ink3);font-size:8px;font-weight:600;white-space:nowrap}
  .portfolio-summary b{display:block;margin-top:4px;font-size:11px;font-weight:680;font-variant-numeric:tabular-nums;white-space:nowrap}
  .hold{
    appearance:none;display:grid;width:100%;grid-template-columns:23px minmax(0,1fr);align-items:start;gap:9px;
    margin-bottom:7px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);text-align:left
  }
  .hold:hover{box-shadow:none;transform:none;border-color:#cfd0cc}
  .hold:focus-visible{outline:3px solid rgba(85,87,217,.17);outline-offset:1px}
  .hold.on{border-color:#bfc0ed;background:#fafaff;box-shadow:inset 2px 0 0 var(--purple)}
  .hold-rank{display:flex;width:23px;height:23px;align-items:center;justify-content:center;border-radius:6px;background:#f0f0ed;color:#7b7f88;font-size:8px;font-weight:750}
  .hold.on .hold-rank{background:#eeefff;color:var(--purple)}
  .hold-body{display:block;min-width:0}
  .hold-top,.hold-top>span:first-child,.hold-weight{display:flex;align-items:center}
  .hold-top{justify-content:space-between;gap:8px}
  .hold-top .nm{font-size:12px;font-weight:700}
  .hold-top .cd{margin-left:5px;color:var(--ink3);font-size:8px}
  .hold-top .pill{padding:2px 6px;border-radius:6px;font-size:10px}
  .hold-prices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}
  .hold-prices b{display:block;margin-top:2px;color:var(--ink2);font-size:9px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
  .hold-weight{justify-content:space-between;margin-top:9px;color:var(--ink3);font-size:9px;font-weight:600}
  .hold .wb{display:block;height:3px;margin-top:5px;background:#ecece8}
  .hold .wb i{background:var(--purple);opacity:.72}
  .hold-signal{display:block;margin-top:7px;color:var(--cyan);font-size:8px;font-weight:650}
  .left-extra{margin-top:12px;border-top:1px solid var(--line)}
  .left-extra>summary{display:flex;align-items:center;justify-content:space-between;padding:12px 2px 6px;list-style:none;color:var(--ink2);font-size:10px;font-weight:650;cursor:pointer}
  .left-extra>summary::-webkit-details-marker{display:none}
  .left-extra>summary span{font-size:15px;color:var(--ink3);transition:transform .16s}
  .left-extra[open]>summary span{transform:rotate(90deg)}

  .asset-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 0 10px}
  .asset-title b{font-size:19px;font-weight:720;letter-spacing:-.025em}
  .asset-title small{margin-left:7px;color:var(--ink3);font-size:9px}
  .asset-quote{text-align:right}
  .asset-quote>b{font-size:22px;font-weight:700;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
  .asset-quote small{margin-left:7px;font-size:11px;font-weight:700}
  .position-glance{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:10px;border:1px solid var(--line);border-radius:10px;background:#fafaf8}
  .position-glance>span{min-width:0;padding:8px 10px}
  .position-glance>span+span{border-left:1px solid var(--line)}
  .position-glance b{display:block;margin-top:3px;color:var(--ink2);font-size:10px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
  .chart{min-height:310px;border:1px solid #ecece8;border-radius:11px;background:#fbfbf9;overflow:hidden}
  .kmark{
    appearance:none;width:19px;height:19px;padding:0;border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;line-height:1;
    transform:translate(-50%,-50%);color:#fff!important;font-size:8px;font-weight:800;filter:none;box-shadow:0 2px 7px rgba(20,21,24,.22);z-index:4;cursor:pointer
  }
  .kmark.buy{background:var(--up)}.kmark.sell{background:var(--down)}
  .kmark::after{
    content:attr(data-price);position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:none;
    padding:3px 6px;border-radius:5px;background:#17191e;color:#fff;font-size:8px;font-weight:650;white-space:nowrap
  }
  .kmark:hover::after{display:block}
  .last-price{position:absolute;padding:2px 5px;border-radius:5px;background:#25272c;color:#fff;font-size:9px;font-weight:700;font-variant-numeric:tabular-nums}
  .klegend{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-top:7px;color:var(--ink3);font-size:8px}
  .klegend>span{display:inline-flex;align-items:center;gap:4px}
  .klegend i{margin:0}
  .legend-trade{display:inline-flex;width:15px;height:15px;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-size:7px}
  .legend-trade.buy{background:var(--up)}.legend-trade.sell{background:var(--down)}
  .legend-note{margin-left:auto}
  .chart-note{margin-top:9px}

  .log-head{margin-bottom:10px}
  .trade-summary{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:10px;border:1px solid var(--line);border-radius:10px;background:#fafaf8}
  .trade-summary>span{padding:9px 10px}
  .trade-summary>span+span{border-left:1px solid var(--line)}
  .trade-summary b{display:block;margin-top:3px;font-size:11px;font-weight:680;font-variant-numeric:tabular-nums}
  .log-list{display:flex;flex-direction:column;gap:8px}
  .trade-record{display:grid;grid-template-columns:43px minmax(0,1fr);border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden;cursor:pointer}
  .trade-record:hover{border-color:#d1d1cc}
  .trade-record.open{border-color:#c7c8ed;box-shadow:0 0 0 1px rgba(85,87,217,.04)}
  .trade-rail{display:flex;align-items:center;flex-direction:column;gap:7px;padding:11px 5px;border-right:1px solid var(--line);background:#fafaf8}
  .trade-side{display:flex;width:25px;height:25px;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-size:9px;font-weight:800}
  .trade-record.buy .trade-side{background:var(--up)}.trade-record.sell .trade-side{background:var(--down)}
  .trade-time{color:var(--ink3);font-size:7px;line-height:1.45;text-align:center}
  .trade-content{min-width:0;padding:11px 12px 9px}
  .trade-title{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .trade-title>span:first-child{min-width:0}
  .trade-title b{font-size:12px;font-weight:700}
  .trade-title small{margin-left:5px;color:var(--ink3);font-size:8px}
  .trade-result{padding:2px 6px;border-radius:6px;font-size:9px;font-weight:750;white-space:nowrap}
  .trade-result.up{background:var(--upbg)}.trade-result.down{background:var(--downbg)}
  .trade-result.pending{background:#eeefff;color:var(--purple)}
  .trade-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}
  .trade-facts b{display:block;margin-top:2px;color:var(--ink2);font-size:9px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
  .trade-narr{margin:9px 0 0;color:var(--ink2);font-size:10px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .trade-record.open .trade-narr{-webkit-line-clamp:initial}
  .trade-detail{margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
  .trade-expand{width:100%;margin-top:8px;padding:5px 0 0;border:0;border-top:1px solid #f0f0ed;background:transparent;color:var(--purple);font-size:8px;font-weight:700;text-align:left;cursor:pointer}
  .trade-expand span{display:inline-block;margin-left:2px;transition:transform .16s}
  .trade-record.open .trade-expand span{transform:rotate(90deg)}
  .chip{border-radius:8px;background:#fff;font-size:10px}
  .chip.on{border-color:#cfd0f3;background:#eeefff;color:var(--purple)}
  .bub{border-radius:3px 11px 11px 11px;background:#f7f7f4}
  .foot{color:var(--ink3)}

  @media(max-width:1280px){
    .lbgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .grid{grid-template-columns:290px minmax(0,1fr) 350px}
  }
  @media(max-width:1023px){
    .grid{grid-template-columns:1fr}
  }
  @media(max-width:900px){
    .arena{padding:18px 18px 16px}
    .arena-top{padding:24px}
    .arena-top .at-right{margin-left:0;width:100%}
    .at-stat{flex:1}
    .lbgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .arena-section-head{align-items:flex-start;flex-direction:column;gap:5px}
    .app{padding:12px}
  }
  @media(max-width:640px){
    .arena{padding:10px;gap:18px}
    .arena-top{padding:21px 18px;border-radius:15px}
    .arena-top .at-ttl{font-size:24px}
    .arena-top .at-sub{font-size:12px}
    .arena-top .at-right{display:grid;grid-template-columns:1fr 1fr}
    .at-stat{min-width:0;padding:11px 12px}
    .lbgrid{grid-template-columns:1fr;gap:9px}
    .lbcard{padding:16px}
    .lbhead{margin-bottom:16px}
    .lbmetric{margin-bottom:7px}
    .lbspark{height:48px}
    .arena-section-head p{font-size:11px}
    .dvcard>summary,.dbcard summary{padding:14px}
    .fold-sub{white-space:normal}
    .app{padding:8px}
    .top{gap:8px}
    .topright{margin-left:0;flex-basis:100%;width:100%}
    .share{margin-left:auto}
    .heroL .ret,.heroL .ret.dn{font-size:34px}
    .position-glance{grid-template-columns:1fr 1fr}
    .position-glance>span:nth-child(3){border-left:0}
    .position-glance>span:nth-child(n+3){border-top:1px solid var(--line)}
    .legend-note{flex-basis:100%;margin-left:0}
    .trade-record{grid-template-columns:39px minmax(0,1fr)}
    .trade-content{padding:10px}
    .grid{grid-template-columns:1fr}
  }

  /* ===== V5 · Professional market terminal =====
     详情页采用主流行情软件的扁平工具栏、下划线导航与表格式行情信息。 */
  .app.detail{
    max-width:1640px;padding:12px 18px 10px;gap:9px;background:#f2f4f7;
    color:#171a21;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif
  }
  .app.detail .card{border-color:#dfe3e8;border-radius:7px;box-shadow:none}
  .app.detail .top{
    min-height:54px;padding:8px 12px;border:0;border-radius:7px;background:#171b24;color:#f7f8fa;box-shadow:none
  }
  .app.detail .ava{width:34px;height:34px;border:1px solid #363b47;border-radius:5px;background:#242936;font-size:17px}
  .app.detail .who .nm{color:#fff;font-size:14px;font-weight:700}
  .app.detail .who .nm .lv{border-radius:3px;background:#2b3241;color:#aeb7ca}
  .app.detail .who .tg{color:#8992a5}
  .app.detail .mood{border-color:#363b47;border-radius:4px;background:#222733;color:#b7bfce}
  .app.detail .backbar{
    border-color:#383e49;border-radius:4px;background:#202530;color:#c9cfda
  }
  .app.detail .topright{min-width:0;gap:8px}
  .app.detail .stswitch{min-width:0;flex-wrap:nowrap;overflow-x:auto;gap:0}
  .app.detail .stswitch::-webkit-scrollbar{display:none}
  .app.detail .stchip{
    flex:0 0 auto;padding:7px 9px;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:#8f98aa
  }
  .app.detail .stchip.on{border-bottom-color:#7b86ff;background:transparent;color:#fff}
  .app.detail .bdg{border-radius:4px;background:#202f2c;color:#77c9aa}
  .app.detail .share{padding:6px 10px;border-color:#434a58;border-radius:4px;background:#242a35;color:#dfe3ea}

  .app.detail .hero{gap:8px}
  .app.detail .heroL{padding:16px 18px}
  .app.detail .heroR{padding:14px 16px}
  .app.detail .heroL .ret,.app.detail .heroL .ret.dn{font-size:34px}
  .app.detail .alpha-badge,.app.detail .alpha-badge.dn,.app.detail .alpha-badge.wait{
    border-radius:3px;background:#eef1f6;color:#566075
  }
  .app.detail .kpis{gap:8px}
  .app.detail .kpi{padding:9px 12px;border-radius:6px}
  .app.detail>.say{border-color:#dfe3e8;border-radius:6px;background:#fff}
  .app.detail>.say .sa{border-radius:3px;background:#252b36;color:#fff;font-size:9px;font-weight:750}
  .app.detail>.say .scan{border-radius:3px;background:#eef3f5}

  .app.detail .tabs{
    display:none;gap:26px;min-height:43px;padding:0 16px;border:1px solid #dfe3e8;border-radius:7px;background:#fff
  }
  .app.detail .tab{
    flex:0 0 auto;padding:0 2px;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:#697181;font-size:12px;font-weight:600
  }
  .app.detail .tab.on{border-bottom-color:#4f60d8;background:transparent;color:#171a21;box-shadow:none}
  .app.detail .grid{
    gap:1px;border:1px solid #dfe3e8;border-radius:7px;background:#dfe3e8;overflow:hidden
  }
  .app.detail .col{padding:14px;border:0;border-radius:0;background:#fff;box-shadow:none}

  .app.detail .panel-kicker{color:#8a93a3;letter-spacing:.1em}
  .app.detail .panel-head h3{font-size:13px}
  .app.detail .sortseg,.app.detail .logtabs{padding:0;border:0;border-radius:0;background:transparent}
  .app.detail .sortbtn,.app.detail .logtab{padding:5px 8px;border-bottom:2px solid transparent;border-radius:0}
  .app.detail .sortbtn.on,.app.detail .logtab.on{border-bottom-color:#4f60d8;background:transparent;color:#20242c;box-shadow:none}
  .app.detail .portfolio-summary,.app.detail .trade-summary,.app.detail .position-glance{
    border-color:#e2e6eb;border-radius:4px;background:#f8f9fb
  }
  .app.detail .hold{
    grid-template-columns:22px minmax(0,1fr);margin:0;padding:11px 7px;border:0;border-bottom:1px solid #edf0f3;border-radius:0
  }
  .app.detail .hold:hover{background:#f7f9fc}
  .app.detail .hold.on{border-color:#edf0f3;background:#f1f4ff;box-shadow:inset 2px 0 0 #5363da}
  .app.detail .hold-rank{border-radius:3px;background:#eef1f4}
  .app.detail .hold.on .hold-rank{background:#dfe4ff;color:#4050c4}
  .app.detail .hold .wb{background:#e8ebef}
  .app.detail .hold .wb i{background:#5363da}
  .app.detail .left-extra{border-color:#e2e6eb}

  .app.detail .c-center{padding:0 14px 14px}
  .app.detail .chips{
    flex-wrap:nowrap;gap:22px;margin:0 -14px 13px;padding:0 14px;border-bottom:1px solid #e4e7eb;overflow-x:auto
  }

<script>
const fmtMoney=v=>'¥'+Math.round(v).toLocaleString('zh-CN');
const fmtPct=v=>(v==null)?'—':(v>0?'+':'')+Number(v).toFixed(2)+'%';
const fmtVol=v=>v>=1e8?(v/1e8).toFixed(1)+'亿':v>=1e4?(v/1e4).toFixed(0)+'万':Math.round(v);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cl=v=>v>=0?'up':'down';
// 安全数值格式化：接口字段可能缺失/为字符串(部分源自第三方采集)，统一强转数字再插入 DOM，杜绝 NaN 显示与 innerHTML 注入
const nf=(v,d=2)=>{const n=Number(v);return isFinite(n)?n.toFixed(d):'—';};
const tt=iso=>{if(!iso)return'—';try{return new Date(iso).toLocaleString('zh-CN',{hour12:false}).slice(5);}catch(e){return'—';}};
const TAGS={buy:'买入',sell:'卖出',watch:'观察'},EAV={buy:'▲',sell:'▼',watch:'👁'};
const EVT_CLS={'快讯':'news','研报':'report','文章':'article','信号':'signal'},EVT_EM={'快讯':'⚡','研报':'📑','文章':'📰','信号':'📈'};
const QRW='dfw_2vQ9_k7Rm';
let S={data:null,tab:'center',sel:null,open:null,sort:'mv',logTab:'trades',lastTradeTs:null,mode:'arena',fund:'main',arena:null};
const STY_CN={balanced:'消息面派',aggressive:'激进派',value:'价值派',event:'事件派',contrarian:'逆向派'};
const isMobile=()=>window.innerWidth<1024;
function countUp(el,to,fmt,from){if(from==null||Math.abs(to-from)<1e-9){el.textContent=fmt(to);return;}const t0=performance.now();
  (function step(t){const k=Math.min(1,(t-t0)/650),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(step);})(performance.now());}
function bjNow(){const n=new Date();return new Date(n.getTime()+(n.getTimezoneOffset()+480)*60000);}
function liveState(d){const b=bjNow(),wd=b.getDay(),hm=b.getHours()*60+b.getMinutes();
  // 优先用后端权威的交易日/时段(含 A股节假日日历)；老快照缺字段时回退按星期+时间推算
  const tradingDay=(d.is_trading_day!==undefined)?d.is_trading_day:(wd>=1&&wd<=5);
  const sess=(d.in_session!==undefined)?d.in_session:(wd>=1&&wd<=5&&((hm>=570&&hm<=690)||(hm>=780&&hm<=900)));
  if((d.data_quality||{}).level!=='live')return{bdg:'○ 等待行情',beat:'2.6s'};
  if(!tradingDay)return{bdg:'🎏 休市·下个交易日 09:30 继续',beat:'2.9s'};
  if(sess)return{bdg:'● 实时撮合中',beat:'1.3s'};
  return{bdg:'🌙 已收盘·盘后复盘思考中',beat:'2.8s'};}
function rankOf(st){const n=(st&&st.win_streak)||0;return n>=8?'👑 屠榜中':n>=5?'🚀 火力全开':n>=3?'🔥 '+n+'连胜':'蓄势中';}
function gradeTxt(v){const a=Math.abs(v);return a<0.3?'中性':(v>0?(a>=0.6?'强多':'偏多'):(a>=0.6?'强空':'偏空'));}

function navLine(h,bench){
  const box=document.getElementById('navchart');
  if(!h||h.length<2){const d=S.data||{};box.innerHTML='<div class="empty" style="padding:22px;line-height:1.7">🚀 '+pNm()+'第 '+(d.days_running||1)+' 天发车<br><span style="font-size:11px">已扫读 '+((d.scan&&(d.scan.news+d.scan.report+d.scan.article))||0)+' 条站内情报 · 决策 '+(d.decisions_total||0)+' 次 · 净值曲线开盘后累积</span></div>';return;}
  const W=560,H=120,P=8,allv=h.map(x=>x.value).concat((bench||[]).map(x=>x.value));
  const mn=Math.min(...allv),mx=Math.max(...allv),sp=(mx-mn)||1,n=h.length;
  const X=(i,m)=>P+(W-2*P)*(m===1?.5:i/(m-1)),Y=z=>H-P-(H-2*P)*(z-mn)/sp;
  const path=arr=>arr.map((z,i)=>(i?'L':'M')+X(i,arr.length).toFixed(1)+' '+Y(z).toFixed(1)).join(' ');
  const me=h.map(x=>x.value);
  const ar='M'+X(0,n).toFixed(1)+' '+(H-P)+' '+me.map((z,i)=>'L'+X(i,n).toFixed(1)+' '+Y(z).toFixed(1)).join(' ')+' L'+X(n-1,n).toFixed(1)+' '+(H-P)+' Z';
  let svg='<svg style="width:100%;height:100%;display:block" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><defs><linearGradient id="ng" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="nf" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ec4899" stop-opacity=".18"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0"/></linearGradient></defs>';
  svg+='<path d="'+ar+'" fill="url(#nf)"/>';
  if(bench&&bench.length>1)svg+='<path d="'+path(bench.map(x=>x.value))+'" fill="none" stroke="#9aa0b8" stroke-width="1.6" stroke-dasharray="5 4"/>';
  svg+='<path d="'+path(me)+'" fill="none" stroke="url(#ng)" stroke-width="2.6" stroke-linejoin="round"/></svg>';
  let bub='<div class="navbub me" style="top:'+(Y(me[n-1])/H*100).toFixed(1)+'%"><span class="a">'+((S.data&&S.data.persona&&S.data.persona.emoji)||'🤖')+'</span>'+fmtPct((me[n-1]-1)*100)+'</div>';
  if(bench&&bench.length>1)bub+='<div class="navbub bench" style="top:'+(Y(bench[bench.length-1].value)/H*100).toFixed(1)+'%">沪深300 '+fmtPct((bench[bench.length-1].value-1)*100)+'</div>';
  box.innerHTML=svg+bub;
}

/* ===== K线：实像素渲染(不拉伸) + 量 + MA5/20 + 坐标 + 十字光标 ===== */
function drawK(box,p){
  const full=(p.kline||[]);
  const w=Math.round(box.clientWidth||0),h=Math.round(box.clientHeight||0);
  if(full.length<3||w<60||h<80){box.innerHTML='<div class="empty">日线数据加载中…</div>';return;}
  // 显示窗口聚焦「有本站内容的时段」：最早相关催化剂靠左(留3根上下文)，无则近24根；MA 仍用全量历史算保证准确
  const fdmap={};full.forEach((k,i)=>fdmap[k.d]=i);const lastFD=full[full.length-1].d;
  const fIdx=dt=>{if(fdmap[dt]!=null)return fdmap[dt];if(dt>=lastFD)return full.length-1;let r=-1;for(let i=0;i<full.length;i++){if(full[i].d<=dt)r=i;else break;}return r;};
  const _ei=(p.events||[]).map(e=>fIdx(e.date)).filter(i=>i>=0);
  // 窗口贴着催化剂：从最早事件往前留 2 根开始，让快讯/研报铺满整张图(不强行留空白左半)；无事件则近 22 根
  let start=_ei.length?Math.max(0,Math.min(..._ei)-2):Math.max(0,full.length-22);
  start=Math.min(start,Math.max(0,full.length-8));  // 至少留 ~8 根供均线/上下文
  const kl=full.slice(start),csF=full.map(k=>k.c);
  const P=6,axisH=14,volH=Math.round(h*0.20),gp=5;
  const pTop=26,pBot=h-axisH-volH-gp,vTop=h-axisH-volH,vBot=h-axisH;  // 顶部预留一条标记轨道，旗标不再压蜡烛
  let mn=Math.min(...kl.map(k=>k.l)),mx=Math.max(...kl.map(k=>k.h));const pad=(mx-mn)*.06||1;mn-=pad;mx+=pad;
  const n=kl.length,gw=(w-2*P)/n,bw=Math.max(3,Math.min(30,gw*.6));
  const X=i=>P+gw*i+gw/2,Y=v=>pBot-(pBot-pTop)*(v-mn)/(mx-mn);
  const vmax=Math.max(...kl.map(k=>k.v||0))||1,VY=v=>vBot-(vBot-vTop)*(v/vmax);
  const cs=kl.map(k=>k.c),ma=(per,i)=>{const gi=start+i;if(gi<per-1)return null;let s=0;for(let j=gi-per+1;j<=gi;j++)s+=csF[j];return s/per;};
  let g='';
  for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,y=Y(v);g+='<line x1="0" x2="'+w+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="#ecece8"/>';g+='<text x="'+(w-2)+'" y="'+(y-2).toFixed(1)+'" text-anchor="end" font-size="9" fill="#8b9099">'+v.toFixed(2)+'</text>';}
  kl.forEach((k,i)=>{const x=X(i),up=k.c>=k.o,c=up?'#078564':'#c0445a',yo=Y(k.o),yc=Y(k.c),top=Math.min(yo,yc),bh=Math.max(1.2,Math.abs(yc-yo));
    g+='<line x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+Y(k.h).toFixed(1)+'" y2="'+Y(k.l).toFixed(1)+'" stroke="'+c+'"/>';
    g+='<rect x="'+(x-bw/2).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx=".4" fill="'+c+'"/>';
    const vy=VY(k.v||0);g+='<rect x="'+(x-bw/2).toFixed(1)+'" y="'+vy.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(.6,vBot-vy).toFixed(1)+'" fill="'+c+'" opacity=".45"/>';});
  const mline=(per,col)=>{const pts=cs.map((_,i)=>{const m=ma(per,i);return m==null?null:X(i).toFixed(1)+','+Y(m).toFixed(1);}).filter(Boolean).join(' ');return pts?'<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="1.4" opacity=".92"/>':'';};
  g+=mline(5,'#a86d16')+mline(20,'#5557d9');
  const last=cs[n-1],yl=Y(last);g+='<line x1="0" x2="'+w+'" y1="'+yl.toFixed(1)+'" y2="'+yl.toFixed(1)+'" stroke="#777c86" stroke-dasharray="3 3" opacity=".48"/>';
  const stp=Math.max(1,Math.floor(n/4));for(let i=0;i<n;i+=stp){g+='<text x="'+X(i).toFixed(1)+'" y="'+(h-3)+'" text-anchor="middle" font-size="9" fill="#8b9099">'+kl[i].d.slice(5)+'</text>';}
  const dmap={};kl.forEach((k,i)=>dmap[k.d]=i);const lastD=kl[n-1].d,firstD=kl[0].d;
  // 事件日期→最近的≤该日的交易日蜡烛(非交易日发的就落到前一个交易日)，让快讯/研报铺在对应日期
  const idxOf=dt=>{if(dmap[dt]!=null)return dmap[dt];if(dt>=lastD)return n-1;if(dt<firstD)return -1;let r=-1;for(let i=0;i<n;i++){if(kl[i].d<=dt)r=i;else break;}return r;};
  // 催化剂连线：本站快讯/研报(顶部旗) ↓ 阿尔法买入(▲) —— 把"信息→交易"画在 K 线上
  const evDates=new Set((p.events||[]).map(e=>e.date));
  (p.marks||[]).forEach(m=>{if(m.side==='buy'&&evDates.has(m.date)){const i=idxOf(m.date);if(i<0)return;const x=X(i).toFixed(1);g+='<line x1="'+x+'" x2="'+x+'" y1="20" y2="'+Y(m.price).toFixed(1)+'" stroke="#5557d9" stroke-width="1.1" stroke-dasharray="2 3" opacity=".48"/>';}});
  let ovl='<span class="last-price" style="right:3px;top:'+(yl-8).toFixed(1)+'px">'+last.toFixed(2)+'</span>';
  const markTotals={},markSeen={};
  (p.marks||[]).forEach(m=>{const i=idxOf(m.date);if(i<0)return;const key=i+'-'+m.side;markTotals[key]=(markTotals[key]||0)+1;});
  (p.marks||[]).forEach(m=>{const i=idxOf(m.date);if(i<0)return;const buy=m.side==='buy',key=i+'-'+m.side,slot=markSeen[key]||0,total=markTotals[key]||1;
    markSeen[key]=slot+1;const dx=(slot-(total-1)/2)*20,dy=buy?9:-9,my=Math.max(31,Math.min(pBot-5,Y(m.price)+dy));
    ovl+='<button type="button" class="kmark '+(buy?'buy':'sell')+'" style="left:'+(X(i)+dx).toFixed(1)+'px;top:'+my.toFixed(1)+'px" data-ktrade="1" data-symbol="'+esc(p.symbol)+'" data-side="'+esc(m.side)+'" data-date="'+esc(m.date)+'" data-price="'+nf(m.price)+'" title="'+(buy?'买入':'卖出')+' ¥'+nf(m.price)+' · '+esc(m.date)+' · 点击查看交割记录">'+(buy?'买':'卖')+'</button>';});
  // 同一根 K 线的多条本站内容合并成一个标记(避免顶部堆成噪声)：取最新一条做代表，>1 条用角标显数量；统一落在顶部预留轨道

function spark(hist,bench,color){
  const h=(hist||[]).map(x=>x.value),b=(bench||[]).map(x=>x.value);
  if(h.length<2){ // 未开赛/数据少：画一条 1.0 基准虚线 + 「蓄势」，比"累积中"文字更像活的
    return '<svg viewBox="0 0 300 46" preserveAspectRatio="none" style="width:100%;height:100%;display:block">'+
      '<line x1="3" y1="23" x2="297" y2="23" stroke="'+color+'" stroke-width="1.6" stroke-dasharray="5 4" opacity=".55"/>'+
      '<text x="150" y="18" text-anchor="middle" font-size="9" fill="#9aa0b8">蓄势 · 开盘开赛</text></svg>';}
  const W=300,H=46,P=3,all=h.concat(b),mn=Math.min(...all),mx=Math.max(...all),sp=(mx-mn)||1;
  const X=(i,n)=>P+(W-2*P)*(n<2?.5:i/(n-1)),Y=v=>H-P-(H-2*P)*(v-mn)/sp;
  const path=a=>a.map((v,i)=>(i?'L':'M')+X(i,a.length).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  let s='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:100%;display:block">';
  if(b.length>1)s+='<path d="'+path(b)+'" fill="none" stroke="#c2c7da" stroke-width="1.4" stroke-dasharray="4 3"/>';
  s+='<path d="'+path(h)+'" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linejoin="round"/></svg>';
  return s;
}

  if(!sts.length){el.innerHTML='<header class="arena-top"><div class="at-brand"><span class="at-kicker">DeepFocus · AI Lab</span><div class="at-title-row"><h1 class="at-ttl">AI 策略实验室</h1><span class="at-status">数据接入中</span></div><div class="at-sub">五种投资纪律，同一组公开信息，持续验证策略表现。</div></div></header><div class="empty">策略数据正在准备，请稍后再看</div>';return;}
  // 是否已开赛：任一选手有收益/持仓/平仓即视为开赛；否则蓄势态(收益都 0)
  const racing=sts.some(s=>Math.abs(s.nav_pct||0)>0.009||(s.position_count||0)>0||(s.closed||0)>0);
  const status=d.in_session?'实时更新':(d.is_trading_day?(d.phase_label||'盘前 / 盘后'):(d.phase_label||'休市'));
  const champ=sts.find(s=>s.fund_id===d.champion)||sts[0];
  const champValue=racing?fmtPct(champ.nav_pct):'待开赛',benchValue=bench?fmtPct(bench.nav_pct):'—';
  const head='<header class="arena-top"><div class="at-brand"><span class="at-kicker">DeepFocus · AI Lab</span>'+
    '<div class="at-title-row"><h1 class="at-ttl">AI 策略实验室</h1><span class="at-status">'+esc(status)+'</span></div>'+
    '<div class="at-sub">'+sts.length+' 种投资纪律使用同一组 DeepFocus 快讯、文章与研报，在完全公开的规则下进行模拟交易。</div></div>'+
    '<div class="at-right"><div class="at-stat"><span>当前领先</span><strong>'+esc(champ.name)+'<i class="'+((champ.nav_pct||0)>=0?'up':'down')+'">'+champValue+'</i></strong></div>'+
    '<div class="at-stat"><span>市场基准</span><strong>'+esc((bench&&bench.name)||'沪深300')+'<i class="'+(((bench&&bench.nav_pct)||0)>=0?'up':'down')+'">'+benchValue+'</i></strong></div></div></header>';
  const cards='<section class="arena-portfolios"><div class="arena-section-head"><div><span class="section-kicker">Live portfolios</span><h2>五种风格，同场验证</h2></div>'+
    '<p>点击任一策略，查看持仓、净值与完整决策链</p></div><div class="lbgrid">'+sts.map(s=>lbcard(s,bench,racing)).join('')+'</div></section>';
  const foot='<div class="arena-foot">虚拟资金 · 模拟交易 · 不构成投资建议 · 历史表现不代表未来 · <a href="https://daocaijing.com?ch=aifund_arena">进入 DeepFocus 终端查看原始信息 →</a></div>';
  el.innerHTML=head+cards+divergenceCard(d)+'<div id="debateBox"></div>'+foot;
  renderDebateBox();
  const fold=document.getElementById('divergenceFold');
  if(fold)fold.addEventListener('toggle',()=>{S.divergenceOpen=fold.open;});
}
/* ===== 今日分歧(get_arena 的 consensus/divergence) + 多空辩论回放(snapshot 的 latest_debate) ===== */
function agChip(a){a=a||{};return '<span class="dv-ag">'+esc(a.emoji||'🤖')+' '+esc(a.name||'')+'</span>';}
function dvSide(cls,title,agents,quote,by){
  const q=quote?'<div class="dv-q">“'+esc(quote)+'”'+(by?' <span class="db-ref">— '+esc(by)+'</span>':'')+'</div>'
    :'<div class="dv-q mute2">立场来自其当前持仓/最新观点；两派解说生成后在此展示。</div>';
  return '<div class="dv-side '+cls+'"><div class="st">'+title+'</div>'+(agents||[]).map(agChip).join('')+q+'</div>';
}
function divergenceCard(d){
  const div=(d&&Array.isArray(d.divergence))?d.divergence:[],cons=(d&&Array.isArray(d.consensus))?d.consensus:[];
  const consHtml=cons.length?'<div class="dv-cons"><b>共识持仓</b>（至少 2 位策略同时持有）：'+cons.slice(0,5).map(c=>esc(c.name||c.symbol||'')+' <span style="color:var(--ink3);font-size:11px">'+esc(c.symbol||'')+'</span> ×'+(Number(c.hold_count)||0)).join('　·　')+'</div>':'';
  const items=div.slice(0,5).map(v=>{
    const bulls=Array.isArray(v.bulls)?v.bulls:[],bears=Array.isArray(v.bears)?v.bears:[];
    const tk=(v.debate&&typeof v.debate==='object')?v.debate:{};
    return '<div class="dv-it"><div class="dv-hd"><span class="nm">'+esc(v.name||v.symbol||'')+'</span><span class="cd">'+esc(v.symbol||'')+'</span><span class="sp">'+bulls.length+' 多 vs '+bears.length+' 空</span></div>'+
      '<div class="dv-cols">'+
      dvSide('bull','▲ 看多 / 在拿',bulls,tk.bull,tk.bull_agent&&tk.bull_agent.name)+
      dvSide('bear','▼ 看空 / 在躲',bears,tk.bear,tk.bear_agent&&tk.bear_agent.name)+
      '</div></div>';
  }).join('');
  const body=items||'<div class="empty" style="padding:12px">今日各派暂无分歧 —— 出现「有人拿·有人躲」的票时，两派理由会在这里并排展示。</div>';
  const count=div.length?div.length+' 组':'暂无';
  return '<details class="card dvcard" id="divergenceFold"'+(S.divergenceOpen?' open':'')+'><summary><span class="fold-copy"><span class="fold-kicker">Cross-strategy view</span><span class="fold-title">今日策略分歧</span>'+
    '<span class="fold-sub">同一只股票，不同策略为何买入、持有或回避</span></span><span class="fold-count">'+count+'</span><span class="fold-arrow">›</span></summary>'+
    '<div class="dv-body">'+consHtml+body+'</div></details>';
}
function vdCls(v){return v==='驳倒'?'win':v==='削弱'?'soft':'ok';}
function renderDebateBox(){
  const box=document.getElementById('debateBox');if(!box)return;
  const staticHead=msg=>'<div class="card dbcard"><div class="db-static"><span class="fold-kicker">Decision review</span><span class="fold-title">多空辩论回放</span>'+
    '<span class="fold-sub">建仓前的多头立论、空头审视与最终裁决</span><div class="empty">'+msg+'</div></div></div>';
  const ld=S.mainDebate;
  if(ld===undefined){box.innerHTML=staticHead('正在读取最近一笔建仓推演…');return;}
  const db=(ld&&ld.debate&&typeof ld.debate==='object')?ld.debate:null;
  if(!db){box.innerHTML=staticHead('暂无记录。下一笔建仓前的完整推演会在这里公开。');return;}
  const bull=(db.bull&&typeof db.bull==='object')?db.bull:{},reb=(db.rebuttal&&typeof db.rebuttal==='object')?db.rebuttal:{},vd=(db.verdict&&typeof db.verdict==='object')?db.verdict:{};
  const args=(Array.isArray(bull.key_args)?bull.key_args:[]).slice(0,5).map(a=>{const p=(a&&typeof a==='object')?a:{point:a};
    return '<div class="db-li"><span>•</span><span>'+esc(p.point||'')+(p.evidence_ref?' <span class="db-ref">〔'+esc(p.evidence_ref)+'〕</span>':'')+'</span></div>';}).join('');
  const bconf=(typeof bull.confidence==='number'&&isFinite(bull.confidence))?' · 信心 '+Math.round(bull.confidence*100)+'%':'';
  const rebs=(Array.isArray(reb.rebuttals)?reb.rebuttals:[]).slice(0,5).map(r=>{const p=(r&&typeof r==='object')?r:{reasoning:r};
    return '<div class="db-li"><span class="vd '+vdCls(p.verdict)+'">'+esc(p.verdict||'审视')+'</span><span>'+esc(p.targets_bull_point||'')+(p.reasoning?' <span class="db-ref">— '+esc(p.reasoning)+'</span>':'')+'</span></div>';}).join('');
  const conc=(Array.isArray(reb.bear_concessions)?reb.bear_concessions:[]).filter(Boolean).slice(0,2).map(x=>esc(typeof x==='string'?x:JSON.stringify(x))).join('；');
  const conv=(typeof vd.conviction==='number'&&isFinite(vd.conviction))?' · 信心 '+Math.round(vd.conviction*100)+'%':'';
  const lean=reb.net_lean||'';
  box.innerHTML='<div class="card dbcard"><details id="debateFold"'+(S.debateOpen?' open':'')+'>'+
    '<summary><span class="fold-copy"><span class="fold-kicker">Decision review</span><span class="fold-title">多空辩论回放 · '+esc(ld.name||ld.symbol||'')+'</span>'+
    '<span class="fold-sub">'+esc(ld.symbol||'')+' · '+tt(ld.ts)+' · 建仓前推演</span></span><span class="ar"><span class="op">收起</span><span class="cl2">展开回放</span> <span class="tri">›</span></span></summary>'+
    '<div class="db-body">'+
    '<div class="db-sec bull"><div class="db-t">▲ 多头立论'+(bull.thesis?'：'+esc(bull.thesis):'')+bconf+'</div>'+(args||'<span class="db-ref">（无逐条论点记录）</span>')+'</div>'+
    '<div class="db-sec bear"><div class="db-t">▼ 空头逐条审视'+(lean?' · 辩后净倾向：'+esc(lean):'')+'</div>'+(rebs||'<span class="db-ref">（无逐条审视记录）</span>')+
      (reb.strongest_bear_point?'<div class="db-ref" style="margin-top:4px">空头最硬一击：'+esc(reb.strongest_bear_point)+'</div>':'')+
      (conc?'<div class="db-ref">空头也承认：'+conc+'</div>':'')+'</div>'+
    '<div class="db-sec judge"><div class="db-t">⚖️ 裁判裁决：'+esc(vd.decision||'—')+(vd.net_lean?' · '+esc(vd.net_lean):'')+conv+'</div>'+
      (vd.thesis?'<div>'+esc(vd.thesis)+'</div>':'')+
      (vd.edge_reason?'<div class="db-ref" style="margin-top:3px">为什么是它：'+esc(vd.edge_reason)+'</div>':'')+
      (vd.key_risk?'<div class="db-ref" style="margin-top:3px">最大风险：'+esc(vd.key_risk)+'</div>':'')+
      (vd.invalidation?'<div class="db-stop"><b>🧯 止损/认错条件</b>：'+esc(vd.invalidation)+'<div class="cav">※ 上述止损位为模拟盘内部纪律，非操作建议</div></div>':'')+
    '</div></div>'+
    '<div class="db-disc">AI 模拟盘为投研能力演示 · 虚拟资金 · 模拟交易，不构成投资建议 · 历史不代表未来</div>'+
    '</details></div>';
  const dt=document.getElementById('debateFold');
  if(dt)dt.addEventListener('toggle',()=>{S.debateOpen=dt.open;});
}
async function loadDebate(){
  try{const r=await fetch('/api/ai-fund/snapshot?strategy=main&w='+QRW,{cache:'no-store',headers:{'Accept':'application/json'}});
    if(r.ok){const d=await r.json();S.mainDebate=(d&&d.latest_debate)||null;}
    else if(S.mainDebate===undefined)S.mainDebate=null;
  }catch(e){if(S.mainDebate===undefined)S.mainDebate=null;}
  if(S.mode==='arena')renderDebateBox();
}
function showStSwitch(){
  const sts=(S.arena&&S.arena.strategies)||[];const el=document.getElementById('stswitch');if(!el)return;
  el.innerHTML=sts.map(s=>'<span class="stchip'+(s.fund_id===S.fund?' on':'')+'" data-fund="'+esc(s.fund_id)+'">'+(s.emoji||'')+esc(s.name)+'</span>').join('');
}
function setMode(m){
  S.mode=m;
  document.getElementById('arenaView').style.display=m==='arena'?'flex':'none';
  document.getElementById('appView').style.display=m==='detail'?'flex':'none';
  document.getElementById('appView').classList.toggle('detail',m==='detail');
}
// 网络连通性指示：连续失败 ≥2 次就把状态徽标改成「连接中断·数据停留在 HH:MM」，避免用户盯着旧数据误以为是实时
function netOk(){S.lastOk=Date.now();S.failN=0;}
function netFail(){S.failN=(S.failN||0)+1;if(S.failN>=2){const t=S.lastOk?new Date(S.lastOk).toLocaleTimeString('zh-CN',{hour12:false}).slice(0,5):'';const b=document.getElementById('bdg');if(b)b.textContent='⚠ 连接中断'+(t?' · 数据停留在 '+t:'');}}
async function loadArena(){
  try{const r=await fetch('/api/ai-fund/arena?w='+QRW,{cache:'no-store',headers:{'Accept':'application/json'}});if(!r.ok)throw 0;
    const d=await r.json();netOk();
    if(d&&d.ready===false){ // 引擎竞技场未就绪 → 回退单账户主视图
      if(S.mode==='arena'){S.fund='main';setMode('detail');await load();}
      return;}
    S.arena=d;if(S.mode==='arena')renderArena(d);showStSwitch();
    loadDebate();  // 多空辩论回放：取主账户 snapshot 顶层 latest_debate(与竞技场同节奏刷新)
  }catch(e){ // 竞技场端点不存在/报错 → 回退单账户主视图，保证页面始终可用
    netFail();
    if(!S.arena&&S.mode==='arena'){S.fund='main';setMode('detail');await load();}
  }
}
function openDetail(fund){S.fund=fund;S.sel=null;S.open=null;S.data=null;setMode('detail');showStSwitch();load();}
function backToArena(){setMode('arena');loadArena();}
async function load(){try{const r=await fetch('/api/ai-fund/snapshot?strategy='+encodeURIComponent(S.fund)+'&w='+QRW,{cache:'no-store',headers:{'Accept':'application/json'}});if(!r.ok)throw 0;render(await r.json());netOk();showStSwitch();}
  catch(e){netFail();if(!S.data)document.getElementById('colCenter').innerHTML='<div class="empty">数据加载失败，正在自动重试…</div>';}}
function poll(){if(S.mode==='arena')loadArena();else load();}
// 竞技场卡片 / 切换器 / 返回
document.addEventListener('click',e=>{
  const lc=e.target.closest('.lbcard[data-fund]');if(lc){openDetail(lc.dataset.fund);return;}
  const sc=e.target.closest('.stchip[data-fund]');if(sc){if(sc.dataset.fund!==S.fund)openDetail(sc.dataset.fund);return;}
  if(e.target.closest('#backArena')){backToArena();return;}
});
// 轮询：标签页切到后台时暂停(省服务器+省流量，避免后台标签持续打接口)，回前台立即拉一次并恢复
let _pollT=null;
function startPoll(){stopPoll();_pollT=setInterval(poll,30000);}
function stopPoll(){if(_pollT){clearInterval(_pollT);_pollT=null;}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopPoll();else{poll();startPoll();}});
loadArena();startPoll();
</script>
