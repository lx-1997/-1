# Place once inside the HTTPS server block. Do not duplicate the live location.
    # Quant research shell only; data routes retain JWT and API guard.
    location = /quant-research {
        if ($bad_bot) { return 444; }
        limit_req zone=crawlers burst=10 nodelay;
        proxy_pass http://127.0.0.1:8300/api/quant-research/workspace;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
