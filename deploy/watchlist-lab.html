<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>自选股纪律体检 · DeepFocus 内测</title>
<style>
  :root{--bg:#0b0e14;--panel:#11161f;--line:#1e2735;--txt:#d7dee8;--dim:#8b98a9;
        --green:#22c55e;--red:#ef4444;--amber:#f59e0b;--blue:#60a5fa;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:18px;max-width:1080px;margin:0 auto}
  h1{font-size:18px;letter-spacing:1px;margin-bottom:2px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:14px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:7px 10px;min-width:280px;font-size:13px}
  button{background:#1a2332;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:7px 16px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--blue)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:12px;color:var(--dim)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .nm{font-weight:600;font-size:15px}
  .code{color:var(--dim);font-size:12px;margin-left:6px}
  .badge{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid}
  .b-strong{color:var(--green);border-color:var(--green)}
  .b-hold{color:var(--blue);border-color:var(--blue)}
  .b-trim{color:var(--amber);border-color:var(--amber)}
  .b-exit{color:var(--red);border-color:var(--red)}
  .b-na{color:var(--dim);border-color:var(--dim)}
  .px{font-size:20px;font-weight:700;margin:2px 0 6px}
  .up{color:var(--green)}.dn{color:var(--red)}
  table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
  td{padding:3px 0;color:var(--dim)}td.v{text-align:right;color:var(--txt);font-variant-numeric:tabular-nums}
  .gates span{display:inline-block;font-size:12px;margin-right:10px;color:var(--dim)}
  .gates b{font-weight:400}
  .ok{color:var(--green)}.no{color:var(--red)}
  .flags{margin-top:6px}
  .flag{display:block;font-size:12px;color:var(--amber);margin-top:2px}
  .note{font-size:12px;color:var(--dim);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
  .rules{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:16px 0;font-size:13px;color:var(--dim)}
  .rules li{margin:4px 0 4px 18px}
  .disc{font-size:11px;color:#5d6b7d;margin:18px 0;line-height:1.7}
  .center{padding:60px 10px;text-align:center;color:var(--dim)}
  a{color:var(--blue)}
</style>
</head>
<body>
<h1>📋 自选股纪律体检 <span style="font-size:11px;color:var(--amber);vertical-align:middle">内测</span></h1>
<div class="sub">趋势状态机 · 开仓四道闸 · 移动参考线 · 估值旗标 —— 规则自动推导,不构成投资建议</div>
<div class="bar">
  <input id="syms" placeholder="留空=我的自选股;支持代码/中文名: 建滔集团,300750,NVDA">
  <button onclick="load()">体检</button>
  <span id="meta" style="font-size:12px;color:var(--dim)"></span>
</div>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
<div id="empty" class="center" style="display:none"></div>
<div class="rules" id="rules" style="display:none"></div>
<div class="disc" id="disc"></div>
<script>
const S_CLS = {"右侧强势区":"b-strong","站线震荡区":"b-hold","移动止损触发区":"b-trim","破位信号区":"b-exit","数据不足":"b-na"};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
async function load(){
  const grid=document.getElementById('grid'), empty=document.getElementById('empty');
  grid.innerHTML=''; empty.style.display='none';
  document.getElementById('chips').innerHTML=''; document.getElementById('rules').style.display='none';
  const token=localStorage.getItem('auth_token');
  if(!token){empty.style.display='block';empty.innerHTML='请先在 <a href="/">主站</a> 登录,再刷新本页(同域共享登录态)。';return;}
  document.getElementById('meta').textContent='体检中…';
  const q=document.getElementById('syms').value.trim();
  let resp;
  try{
    resp=await fetch('/api/watchlist/analysis'+(q?('?symbols='+encodeURIComponent(q)):''),{
      headers:{'Authorization':'Bearer '+token,'X-Df-Web':'dfw_2vQ9_k7Rm'}});
  }catch(e){document.getElementById('meta').textContent='网络错误';return;}
  if(resp.status===401){empty.style.display='block';empty.innerHTML='登录态失效,请回 <a href="/">主站</a> 重新登录。';document.getElementById('meta').textContent='';return;}
  if(resp.status===403){empty.style.display='block';empty.textContent='内测功能,暂未对当前账号开放。';document.getElementById('meta').textContent='';return;}
  const d=await resp.json();
  document.getElementById('meta').textContent=(d.generated_at||'').replace('T',' ').slice(0,19)+(d.count?(' · '+d.count+'只'):'');
  if(d.unresolved&&d.unresolved.length){const c=document.createElement('span');c.className='chip';c.style.color='var(--amber)';c.textContent='未识别: '+d.unresolved.join('、');document.getElementById('chips').appendChild(c);}
  if(!d.items||!d.items.length){empty.style.display='block';empty.textContent=d.note||'自选股为空';return;}
  const chips=document.getElementById('chips');
  Object.entries(d.summary||{}).forEach(([k,v])=>{const c=document.createElement('span');c.className='chip';c.innerHTML=esc(k)+' <b>'+v+'</b>';chips.appendChild(c);});
  for(const it of d.items){
    const cls=S_CLS[it.state]||'b-na';
    const p5=it.pct_5d, p5cls=p5>0?'up':(p5<0?'dn':'');
    const gates=Object.entries(it.gates||{}).map(([k,v])=>`<span class="${v?'ok':'no'}">${v?'✓':'✗'} <b>${esc(k.split('(')[0])}</b></span>`).join('');
    const lv=Object.entries(it.levels||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="v">${v==null?'—':v}</td></tr>`).join('');
    const val=it.valuation||{};
    const vline=(val.pe!=null||val.pb!=null)?`<tr><td>PE / PB</td><td class="v">${val.pe==null?'—':Number(val.pe).toFixed(1)} / ${val.pb==null?'—':Number(val.pb).toFixed(2)}</td></tr>`:'';
    const flags=(val.flags||[]).map(f=>`<span class="flag">⚠ ${esc(f)}</span>`).join('');
    const gaps=(it.data_gaps||[]).map(g=>`<span class="flag" style="color:#5d6b7d">ℹ ${esc(g)}</span>`).join('');
    const card=document.createElement('div');card.className='card';
    card.innerHTML=`
      <div class="hd"><span><span class="nm">${esc(it.name||it.symbol)}</span><span class="code">${esc(it.symbol)} · ${esc(it.market||'')}</span></span>
        <span class="badge ${cls}">${esc(it.state)}</span></div>
      <div class="px">${it.close==null?'—':it.close} <span style="font-size:12px" class="${p5cls}">${p5==null?'':(p5>0?'+':'')+p5+'% /5日'}</span>
        <span style="font-size:11px;color:var(--dim)">${it.off_high_60d==null?'':' 距60日高 '+it.off_high_60d+'%'}</span></div>
      <div class="gates">${gates}</div>
      <table>${lv}${vline}</table>
      <div class="flags">${flags}${gaps}</div>
      <div class="note">${esc(it.note||'')}</div>`;
    grid.appendChild(card);
  }
  if(d.discipline&&d.discipline.length){const r=document.getElementById('rules');r.style.display='block';
    r.innerHTML='<b style="color:var(--txt)">📐 纪律速查</b><ul>'+d.discipline.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';}
  document.getElementById('disc').textContent='⚠️ '+(d.disclaimer||'');
  document.getElementById('meta').textContent=(d.generated_at||'').replace('T',' ').slice(0,19)+' · '+d.count+'只 · K线截至最近交易日';
}
load();
</script>
</body>
</html>
